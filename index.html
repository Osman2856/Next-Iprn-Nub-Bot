<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NEXT IPRN NUM BOT - Panel</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  body{background:#000;color:#fff;min-height:100vh;padding-bottom:90px}
  .wrap{max-width:430px;margin:0 auto;padding:16px}
  .top{display:flex;align-items:center;gap:10px;padding:6px 4px 18px}
  .avatar{width:42px;height:42px;border-radius:50%;background:#7c3aed;display:flex;align-items:center;justify-content:center;font-weight:800}
  .top h1{font-size:18px;line-height:1.1}
  .top p{font-size:13px;color:#a855f7}
  .card{background:#161616;border:1px solid #2a2a2a;border-radius:22px;padding:20px}
  .label{font-size:12px;letter-spacing:1.5px;color:#999}
  .balance{font-size:42px;font-weight:800;letter-spacing:-1px;margin:4px 0 16px}
  .balance small{font-size:22px;color:#999;font-weight:600}
  .stats{display:flex;justify-content:space-between;border-top:1px solid #2a2a2a;padding-top:16px;gap:8px}
  .stats b{display:block;font-size:15px;margin-top:4px}
  .stats span{font-size:11px;letter-spacing:1px;color:#999}
  .row{display:flex;gap:12px;margin-top:16px}
  .btn{flex:1;border:0;border-radius:16px;padding:14px;font-size:15px;font-weight:700;cursor:pointer}
  .btn-purple{background:#9333ea;color:#fff}
  .btn-dark{background:#222;color:#fff;border:1px solid #333}
  .min{text-align:center;color:#888;font-size:13px;margin-top:10px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}
  .tile{background:#2a0a4a;border-radius:18px;padding:18px 16px;cursor:pointer}
  .tile i{font-style:normal;font-size:22px;color:#c084fc}
  .tile h3{font-size:16px;margin:8px 0 4px}
  .tile p{font-size:12px;color:#bbb;line-height:1.4}
  .active{margin-top:28px}
  .active h2{font-size:20px}
  .active h2 span{color:#666;font-size:16px;font-weight:500}
  .empty{text-align:center;color:#999;padding:40px 10px;font-size:17px;font-weight:600}
  .empty div{font-size:48px;margin-bottom:10px}
  nav{position:fixed;left:0;right:0;bottom:0;background:#0a0a0a;border-top:1px solid #222;display:flex;justify-content:space-around;padding:10px 6px 18px;max-width:430px;margin:0 auto}
  nav button{background:none;border:0;color:#888;font-size:12px;cursor:pointer}
  nav button.on{color:#c084fc}
  nav button div{font-size:22px}
  .fab{position:fixed;left:50%;bottom:62px;transform:translateX(-50%);width:62px;height:62px;border-radius:50%;background:#c026d3;border:4px solid #000;color:#fff;font-size:34px;cursor:pointer;z-index:2}
  .services{display:none;margin-top:16px;gap:8px;flex-wrap:wrap}
  .services button{background:#222;border:1px solid #333;color:#fff;padding:10px 14px;border-radius:20px;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="avatar">N</div>
    <div><h1 id="username">NEXT IPRN NUM BOT</h1><p>OTP Number Panel</p></div>
  </div>

  <div class="card">
    <div class="label">BALANCE</div>
    <div class="balance">$<span id="bal">0.00</span></div>
    <div class="stats">
      <div><span>EARNED</span><b id="earned">$0.00</b></div>
      <div><span>OTPS</span><b id="otps">0</b></div>
      <div><span>WITHDRAWN</span><b>$0.00</b></div>
    </div>
    <div class="row">
      <button class="btn btn-purple" onclick="withdraw()">💳 Withdraw</button>
      <button class="btn btn-dark" onclick="alert('History: No transactions yet')">History</button>
    </div>
    <div class="min">Minimum $0.30</div>
  </div>

  <div class="grid">
    <div class="tile" onclick="toggleServices()">
      <i>+</i><h3>Get a number</h3><p>Pick a service and country</p>
    </div>
    <div class="tile" onclick="setPrefix()">
      <i>▽</i><h3>Set prefix</h3><p>Filter by number start</p>
    </div>
  </div>

  <div class="services" id="services">
    <button onclick="pick('Facebook')">Facebook</button>
    <button onclick="pick('WhatsApp')">WhatsApp</button>
    <button onclick="pick('Telegram')">Telegram</button>
    <button onclick="pick('Google')">Google</button>
  </div>

  <div class="active"><h2>Active numbers <span>· 0</span></h2></div>
  <div class="empty"><div>📱</div>No numbers yet</div>
</div>

<button class="fab" onclick="toggleServices()">+</button>

<nav>
  <button class="on"><div>⌂</div>Home</button>
  <button onclick="alert('OTP inbox will open here after backend is connected')"><div>✉️</div>OTP</button>
  <button style="width:40px"></button>
  <button onclick="alert('My Profile: connect backend to show balance & history')"><div>👛</div>My Profile</button>
  <button><div>🌐</div>Live</button>
</nav>

<script>
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) {
    tg.ready(); tg.expand();
    if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
      document.getElementById('username').textContent = tg.initDataUnsafe.user.first_name || 'NEXT IPRN NUM BOT';
    }
  }
  function toggleServices(){
    const s = document.getElementById('services');
    s.style.display = s.style.display === 'flex' ? 'none' : 'flex';
  }
  function pick(service){ alert(service + ' number: connect your number supplier API here to show live stock & price'); }
  function setPrefix(){
    const p = prompt('Enter prefix, e.g. +8801');
    if(p) alert('Prefix set to: ' + p + ' (demo only)');
  }
  function withdraw(){ alert('Minimum withdraw is $0.30. Your balance is $0.00 (demo).'); }
</script>
</body>
</html>
